name: Mimio Windows Release

on:
  push:
    tags: ['mimio-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimio-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        run: |
          $line = (Select-String '^version: ' pubspec.yaml).Line
          if ($line -notmatch '^version: (\d+\.\d+\.\d+)\+(\d+)$') { throw 'Invalid pubspec version' }
          $version = $Matches[1]
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "mimio-v$version") { throw 'Tag and pubspec version differ' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate models
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build release
        run: flutter build windows --release --no-pub
      - name: Check tracked files were not modified
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build changed tracked source or lockfile' }
      - name: Package clean application output
        run: python tool/package_windows_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mimio-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attest, verify and publish
    needs: build
    if: github.event_name == 'push' && github.repository == 'i-iooi-i/Mimio'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mimio-windows-x64
          path: dist
      - name: Check artifact hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/Mimio-*-windows-x64.zip
      - name: Verify provenance
        run: gh attestation verify "dist/Mimio-$VERSION-windows-x64.zip" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
      - name: Create draft release
        run: |
          cat > notes.md <<EOF
          Windows x64 portable build produced by GitHub Actions from the tagged public source.

          - Source commit: $GITHUB_SHA
          - Build and test log: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Flutter: $FLUTTER_VERSION; locked Dart dependencies.
          - Includes SHA-256 checksums, build metadata and GitHub artifact provenance.
          - Extract the complete ZIP and run Mimio.exe. Windows executable remains unsigned.
          - No personal server settings, tokens, avatars or recordings are bundled.

          此版本将 Windows 绿色版发布迁移到公开的 GitHub Actions 工作流，应用界面与 0.3.40 保持一致。
          完整解压后运行 Mimio.exe；请保留旧版本以便回退。
          EOF
          gh release create "$TAG" dist/* --verify-tag --draft --title "Mimio $VERSION" --notes-file notes.md
      - name: Download release assets and verify again
        run: |
          gh release download "$TAG" --dir readback
          cd readback
          sha256sum --check SHA256SUMS.txt
          gh attestation verify "Mimio-$VERSION-windows-x64.zip" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
      - name: Publish verified release
        run: gh release edit "$TAG" --draft=false --latest
